services:
  sensor_scanner:
    image: ghcr.io/minglarn/sensor_scanner:latest
    # build: .
    container_name: sensor_scanner
    restart: unless-stopped
    ports:
      - "8085:8080"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - apparmor:unconfined
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./data:/app/data
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=Europe/Stockholm
      - DEVICE_INDEX=0
      - DEFAULT_MODE=hop
      - RTL_GAIN=auto
      - RTL_PPM=0
      - BLE_ENABLED=true
      - BLE_MODE=smart
      - BLE_DEBOUNCE_SECONDS=15
      - MQTT_HOST=192.168.1.121
      - MQTT_PORT=1883
      - MQTT_USER=
      - MQTT_PASS=
      - MQTT_PREFIX=sensor_scanner
      - HA_DISCOVERY_ENABLED=false
      - HA_DISCOVERY_PREFIX=homeassistant
      - RETENTION_DAYS=30
