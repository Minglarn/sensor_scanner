<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#0c2d48" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.35" />

  <!-- Subtle Radar Grid Rings -->
  <circle cx="256" cy="240" r="176" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.14" stroke-dasharray="8 8" />
  <circle cx="256" cy="240" r="128" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.18" />

  <!-- Left & Right Outer Radio Waves -->
  <path d="M 122 126 A 175 175 0 0 0 122 354" fill="none" stroke="url(#waveGrad)" stroke-width="20" stroke-linecap="round" opacity="0.55" />
  <path d="M 390 126 A 175 175 0 0 1 390 354" fill="none" stroke="url(#waveGrad)" stroke-width="20" stroke-linecap="round" opacity="0.55" />

  <!-- Left & Right Inner Radio Waves -->
  <path d="M 162 162 A 120 120 0 0 0 162 318" fill="none" stroke="url(#waveGrad)" stroke-width="20" stroke-linecap="round" opacity="0.85" />
  <path d="M 350 162 A 120 120 0 0 1 350 318" fill="none" stroke="url(#waveGrad)" stroke-width="20" stroke-linecap="round" opacity="0.85" />

  <!--Left & Right Near Core Waves -->
  <path d="M 200 196 A 70 70 0 0 0 200 284" fill="none" stroke="#e0f2fe" stroke-width="16" stroke-linecap="round" />
  <path d="M 312 196 A 70 70 0 0 1 312 284" fill="none" stroke="#e0f2fe" stroke-width="16" stroke-linecap="round" />

  <!-- Antenna Mast & Base -->
  <path d="M 256 248 L 256 410" fill="none" stroke="url(#coreGrad)" stroke-width="22" stroke-linecap="round" />
  <path d="M 204 410 L 308 410" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" />
  <path d="M 222 350 L 290 350" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.8" />

  <!-- RF Pulse Waveform Overlay at Bottom -->
  <path d="M 96 442 L 178 442 L 202 418 L 228 462 L 256 396 L 284 462 L 310 418 L 334 442 L 416 442" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />

  <!-- Center Transmitter Node -->
  <circle cx="256" cy="240" r="30" fill="#38bdf8" />
  <circle cx="256" cy="240" r="14" fill="#ffffff" />
</svg>
